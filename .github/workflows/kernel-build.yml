name: Build yunluo kernel (KernelSU-Next + Droidspaces)

on:
  workflow_dispatch:
  push:
    branches: [yunluo-s-oss-ksu-droidspaces]

env:
  KSU_NEXT_VERSION: v3.3.0
  # Same AOSP common tree generation the device's working kernel and its
  # vendor modules were built from (5.10.209 era) — required so that module
  # symbol CRCs match and all 187 first-stage vendor modules load.
  COMMON_BRANCH: deprecated/android12-5.10-2024-05

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout build files
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio flex libssl-dev zip wget curl git
          # full-LTO vmlinux link needs more memory than the runner has RAM
          sudo fallocate -l 16G /mnt/ksu-swapfile
          sudo chmod 600 /mnt/ksu-swapfile
          sudo mkswap /mnt/ksu-swapfile
          sudo swapon /mnt/ksu-swapfile
          free -h

      - name: Clone AOSP common kernel
        run: |
          git clone --depth=1 -b "${COMMON_BRANCH}" https://android.googlesource.com/kernel/common kernel-src
          cd kernel-src
          git log --oneline -1

      - name: Set up Neutron Clang
        run: |
          mkdir -p "$HOME/neutron-clang" && cd "$HOME/neutron-clang"
          wget -qO antman https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
          chmod +x antman
          ./antman -S=latest
          echo "$HOME/neutron-clang/bin" >> "$GITHUB_PATH"

      - name: Copy device base config and fragment
        run: |
          cp arch/arm64/configs/yunluo_device_base.config kernel-src/arch/arm64/configs/
          cp arch/arm64/configs/droidspaces_ksu.fragment kernel-src/arch/arm64/configs/

      - name: Integrate KernelSU-Next
        working-directory: kernel-src
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSU_NEXT_VERSION}/kernel/setup.sh" | bash -s "${KSU_NEXT_VERSION}"

      - name: Apply Droidspaces kABI patches
        working-directory: kernel-src
        run: |
          BASE="https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/dev/Documentation/resources/kernel-patches/GKI/below-kernel-6.12"
          curl -fL -o sysvipc.patch "${BASE}/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch"
          curl -fL -o posix_mqueue.patch "${BASE}/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch"
          patch -p1 -N -f < sysvipc.patch || true
          patch -p1 -N -f < posix_mqueue.patch || true
          grep -n 'sysvshm' include/linux/sched.h | head -3

      - name: Relax MODVERSIONS CRC checks for prebuilt vendor modules
        working-directory: kernel-src
        run: |
          python3 ../patch_modversions.py kernel/module.c
          grep -A3 'yunluo-ksu relax' kernel/module.c

      - name: Build Image.gz
        working-directory: kernel-src
        run: |
          mkdir -p out
          cp arch/arm64/configs/yunluo_device_base.config out/.config
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 olddefconfig
          KCONFIG_CONFIG=out/.config scripts/kconfig/merge_config.sh -m out/.config arch/arm64/configs/droidspaces_ksu.fragment
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 olddefconfig
          grep -E 'CONFIG_(KSU|SYSVIPC|POSIX_MQUEUE|IPC_NS|PID_NS|DEVTMPFS|CGROUP_DEVICE|MODVERSIONS)=' out/.config
          make -j"$(nproc)" O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-error" Image.gz
          ls -la out/arch/arm64/boot/Image.gz

      - name: Dump kernel symbol CRCs and verify against device modules
        working-directory: kernel-src
        run: |
          nm out/vmlinux | grep ' __crc_' | awk '{print $3, $1}' > kernel_crcs.txt
          wc -l kernel_crcs.txt
          grep -w module_layout kernel_crcs.txt || echo "module_layout CRC not found!"
          cp ../check_crcs.py .
          cp ../module_crcs.json .
          python3 check_crcs.py | tee crc_verdict.txt

      - name: Upload kernel symbol CRCs
        uses: actions/upload-artifact@v4
        with:
          name: kernel-crcs
          path: |
            kernel-src/kernel_crcs.txt
            kernel-src/crc_verdict.txt

      - name: Package AnyKernel3 flashable zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/.github AnyKernel3/README.md AnyKernel3/anykernel.sh
          cp kernel-src/out/arch/arm64/boot/Image.gz AnyKernel3/
          cat > AnyKernel3/anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script — Redmi Pad (yunluo) GKI 5.10
          ## osm0sis @ xda-developers

          properties() { '
          kernel.string=yunluo android12-5.10 + KernelSU-Next + Droidspaces
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=0
          do.cleanuponabort=0
          '; }

          # boot shell variables — kernel-only, ramdisk untouched
          BLOCK=auto;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;  # skip ramdisk unpack
          flash_boot;  # skip ramdisk repack
          EOF
          cd AnyKernel3
          zip -r9 "../AnyKernel3-yunluo-KSU-Next-${KSU_NEXT_VERSION}-$(date +%Y%m%d).zip" . -x '.git*'

      - name: Upload boot kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image.gz
          path: kernel-src/out/arch/arm64/boot/Image.gz

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-flashable-zip
          path: AnyKernel3-*.zip
